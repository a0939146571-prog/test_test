<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采鈺承攬商環安衛考試系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>采鈺承攬商環安衛考試</h1>
            <p class="subtitle">EHS Contractor Examination System</p>
        </header>

        <div id="page1" class="page active">
            <h2>請輸入應檢人資訊</h2>
            <div class="form-group">
                <label for="vendorName">廠商名稱</label>
                <input type="text" id="vendorName" placeholder="請輸入完整公司全銜" required>
            </div>
            <div class="form-group">
                <label for="employeeId">長工證號碼 (身份證字號第一碼+身分證字號後6碼+"0",共8碼)</label>
                <input type="text" id="employeeId" maxlength="8" pattern="^[a-zA-Z0-9\-]{8}$" placeholder="例如: A1234560" required>
            </div>
            <div class="form-group">
                <label for="userName">姓名</label>
                <input type="text" id="userName" placeholder="請輸入真實姓名" required>
            </div>
            <div class="form-group">
                <label for="examType">選擇考試項目</label>
                <select id="examType" required>
                    <option value="承攬商長期工作證">承攬商長期工作證</option>
                    <option value="緊急入廠_龍潭廠">緊急入廠_龍潭廠</option>
                    <option value="緊急入廠_新竹廠">緊急入廠_新竹廠</option>
                    <option value="天花板_教育訓練">天花板_教育訓練</option>
                    <option value="天花板_簡易母索">天花板_簡易母索</option>
                </select>
            </div>
            <button class="btn-submit" id="startExamBtn">確認並開始測驗</button>
        </div>

        <div id="quizPage" class="page">
            <h2>線上測驗試卷</h2>
            <div id="loadingText" class="loading" style="display: none; color: #0288d1; font-weight: bold; margin: 15px 0;">正在從雲端題庫隨機抽取題型，請稍候...</div>
            
            <form id="quizForm">
                <div id="questionsContainer"></div>
                <input type="submit" id="submitBtn" class="btn-submit" value="確認交卷" style="margin-top: 20px;">
            </form>
        </div>

        <div id="resultPage" class="page">
            <h2>測驗結果評定</h2>
            <div id="resultSummary">
                <div class="info-grid">
                    <p class="info-item"><span>考試項目</span><span id="resExamType" class="value text-highlight"></span></p>
                    <p class="info-item"><span>廠商名稱</span><span id="resVendor" class="value"></span></p>
                    <p class="info-item"><span>工號</span><span id="resId" class="value"></span></p>
                    <p class="info-item"><span>姓名</span><span id="resName" class="value"></span></p>
                </div>
                
                <div class="score-container">
                    <div class="score-box">
                        <span class="score-label">測驗得分</span>
                        <span id="displayScore" class="large-score">0</span>
                    </div>
                    <div id="displayStatus" class="status-box">評定中</div>
                </div>
                
                <h3 style="margin-top:25px; border-bottom: 2px solid #ccc; padding-bottom:5px;">即時作答明細檢討</h3>
                <div id="reviewContainer" class="error-zone"></div>
            </div>
            
            <div class="button-group" style="margin-top: 25px;">
                <button class="btn-submit" onclick="location.reload()">確認並關閉視窗 (系統已自動背景上傳並產出 PDF)</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
